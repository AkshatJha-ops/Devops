apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-k8s
  template:
    metadata:
      labels:
        app: flask-k8s
    spec:
      containers:
        - name: flask
          image: flask-k8s:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 15000
---
apiVersion: v1
kind: Service
metadata:
  name: flask-k8s
spec:
  type: NodePort
  selector:
    app: flask-k8s
  ports:
    - port: 15000
      targetPort: 15000
      protocol: TCP
